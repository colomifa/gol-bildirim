<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kural Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--p:#151b23;--p2:#1d2531;--line:#2a3444;--ink:#e8edf3;--mute:#8a97a8;--acc:#f5b83d;--live:#e5484d;--ok:#3ddc84;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.35 "IBM Plex Sans",system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
select,input{font:inherit;color:var(--ink);background:var(--p2);border:1px solid var(--line);border-radius:4px;padding:7px 8px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0}
.w{max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font:600 14px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
.rt{display:flex;align-items:center;gap:10px;min-width:0}
.st{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;min-width:0}
#stt{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}.dot.ok{background:var(--ok)}
.pill{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.05em;border-radius:12px;padding:5px 10px;border:1px solid var(--ok);color:var(--ok);white-space:nowrap}
.pill.off{border-color:var(--live);color:var(--live);background:rgba(229,72,77,.12)}
nav{display:flex;margin-top:4px}
nav button{flex:1;padding:9px 0;color:var(--mute);border-bottom:2px solid transparent;font-weight:500}
nav button.on{color:var(--acc);border-color:var(--acc)}
nav b{font:600 11px "IBM Plex Mono",monospace;background:var(--p2);border-radius:8px;padding:1px 6px;margin-left:4px}
main{max-width:640px;margin:0 auto;padding:10px 12px}
.empty{color:var(--mute);padding:28px 8px;text-align:center}
.mute{color:var(--mute);font-size:12px;margin-top:6px}
.note{background:rgba(229,72,77,.12);border:1px solid var(--live);color:var(--live);border-radius:5px;padding:8px 10px;margin-bottom:8px;font-size:13px}
#q{margin-bottom:6px}
.mw{border-bottom:1px solid var(--line)}
.m{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 2px;cursor:pointer}
.min{font:600 12px "IBM Plex Mono",monospace;text-align:center;border-radius:3px;padding:4px 0;background:var(--p2);color:var(--mute)}
.min.live{background:var(--live);color:#fff}
.tm{display:flex;justify-content:space-between;gap:8px;min-width:0}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm b{font-weight:600}
.add{display:flex;align-items:center;gap:4px;min-width:40px;height:34px;justify-content:center;border:1px solid var(--line);border-radius:5px;color:var(--acc);font-size:16px}
.add i{font:600 11px "IBM Plex Mono",monospace;font-style:normal;background:var(--acc);color:#111;border-radius:8px;padding:0 5px}
.dt{background:var(--p);border:1px solid var(--line);border-radius:6px;padding:10px;margin:0 0 10px}
.dt table{width:100%;border-collapse:collapse;font-size:13px}
.dt th{color:var(--mute);font-weight:500;font-size:11px;text-align:center;padding:2px}
.dt td{padding:5px 2px;text-align:center;border-top:1px solid var(--line)}
.dt td:first-child{text-align:left;color:var(--mute)}
.dt .tot{margin:10px 0 6px;font-size:13px}
.dt .sx td:first-child,.dt .sx td:last-child{font:600 13px "IBM Plex Mono",monospace;width:25%;color:var(--ink);text-align:center}
.dt .sx td:nth-child(2){color:var(--mute)}
.pt{display:flex;gap:6px;margin:10px 0 4px}
.pt button{flex:1;border:1px solid var(--line);border-radius:5px;padding:6px 0;color:var(--mute);font-size:13px}
.pt button.on{border-color:var(--acc);color:var(--acc)}
.r{background:var(--p);border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.r.off .t{opacity:.5}
.r.dr{border-style:dashed;border-color:var(--acc)}
.rh{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px}
.t{min-width:0;cursor:pointer}
.n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{font:600 10px "IBM Plex Mono",monospace;background:var(--acc);color:#111;border-radius:3px;padding:3px 5px;letter-spacing:.04em}
.chev{color:var(--mute);padding:4px 6px}
.rb{padding:2px 10px 10px;border-top:1px solid var(--line)}
.f{display:block;color:var(--mute);font-size:12px;margin:10px 0 4px}
.mm{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;color:var(--mute)}
.c{display:grid;grid-template-columns:1fr 54px 66px 28px;gap:5px;margin-bottom:5px}
.c .pr{grid-column:1/-1;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.c .pr input{width:70px;flex:none}
.x{color:var(--live)}
.ghost{border:1px solid var(--line);border-radius:5px;padding:8px 12px;color:var(--acc);margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.go{background:var(--acc);color:#111;font-weight:600;border-radius:5px;padding:9px 14px}
.sw{position:relative;width:34px;height:20px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:10px;transition:.15s;pointer-events:none}
.sw span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(14px)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--p);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.bar button{border:1px solid var(--line);border-radius:5px;padding:10px 18px;font-weight:600}
.bar #save{background:var(--acc);border-color:var(--acc);color:#111}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#06210f;font-weight:600;padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(max-width:420px){.c{grid-template-columns:1fr 1fr 28px}.c select:first-child{grid-column:1/-1}#stt{max-width:80px}}
</style>
</head>
<body>
<header><div class="w">
  <div class="top"><h1>Gol Paneli</h1>
    <div class="rt"><div class="st"><span class="dot" id="dot"></span><span id="stt">...</span></div><button class="pill" id="act">● AKTİF</button></div>
  </div>
  <nav>
    <button data-tab="m" class="on">Maçlar <b id="nm">0</b></button>
    <button data-tab="r">Kurallar <b id="nr">0</b></button>
  </nav>
</div></header>
<main>
  <div id="pm"><div id="note" class="note" hidden>Pasif: API'ye sorgu atılmıyor, bildirim gitmiyor. Liste güncellenmez.</div><input id="q" type="search" placeholder="Takım ara..."><div id="list"></div></div>
  <div id="pr" hidden></div>
</main>
<div class="bar"><button id="save">Kaydet</button><button id="test">Test mesajı</button></div>
<div id="toast"></div>

<script>
const GROUPS=[
 ["Maç önü oranı",[["pre_home","Ev"],["pre_draw","Beraberlik"],["pre_away","Deplasman"],["pre_over25","2.5 Üst"]]],
 ["Canlı oran",[["live_home","Ev"],["live_draw","Beraberlik"],["live_away","Deplasman"],["live_over25","2.5 Üst"]]],
 ["Skor",[["home_goals","Ev gol"],["away_goals","Dep gol"],["total_goals","Toplam gol"],["goal_diff","Fark (ev-dep)"]]],
 ["Şut",[["home_shots","Ev şut"],["away_shots","Dep şut"],["total_shots","Toplam şut"],["home_sot","Ev isabetli"],["away_sot","Dep isabetli"],["total_sot","Toplam isabetli"]]],
 ["xG",[["home_xg","Ev"],["away_xg","Dep"],["total_xg","Toplam"]]],
 ["Kırmızı kart",[["home_red","Ev"],["away_red","Dep"],["total_red","Toplam"]]],
 ["Zaman",[["minute","Dakika"]]]
];
const LBL={};GROUPS.forEach(g=>g[1].forEach(m=>LBL[m[0]]=g[0]+" · "+m[1]));
const OPV=[[">=","≥"],[">",">"],["<=","≤"],["<","<"],["==","="]];
const PER=[["all","Tüm maç"],["h1","1. yarı"],["h2","2. yarı"],["last","Son N dakika"]];
const TABS=[["all","Tümü"],["h1","1. yarı"],["h2","2. yarı"],["l10","Son 10 dk"]];
const STAT=/shots|sot|xg|red/;
const SN={"Shots on Goal":"İsabetli şut","Shots off Goal":"İsabetsiz şut","Total Shots":"Toplam şut","Blocked Shots":"Engellenen şut","Shots insidebox":"Ceza sahası içi şut","Shots outsidebox":"Ceza sahası dışı şut","Fouls":"Faul","Corner Kicks":"Korner","Offsides":"Ofsayt","Ball Possession":"Topla oynama","Yellow Cards":"Sarı kart","Red Cards":"Kırmızı kart","Goalkeeper Saves":"Kaleci kurtarışı","Total passes":"Toplam pas","Passes accurate":"İsabetli pas","Passes %":"Pas isabeti","expected_goals":"Gol beklentisi (xG)","goals_prevented":"Önlenen gol"};

const $=id=>document.getElementById(id);
let rules=[],matches=[],updated=null,err="",active=true,tab="m",open=null,openM=null,dper="all",det={},isDirty=false;
let pw=localStorage.getItem("pw")||prompt("Panel şifresi:");
const H=()=>({"Content-Type":"application/json","x-password":pw});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const newCond=()=>({metric:"pre_home",op:">=",value:1.5,period:"all"});
const opT=o=>(OPV.find(x=>x[0]===o)||[0,o])[1];
const isLive=m=>!m.status&&Number(m.minute)>0;
const same=(a,b)=>String(a)===String(b);
const unsaved=()=>isDirty||rules.some(r=>r.draft);
function dirty(v){isDirty=v;$("save").textContent=v?"Kaydet •":"Kaydet"}
window.onbeforeunload=()=>unsaved()?"Kaydedilmemiş değişiklik var":undefined;
let tt;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2400)}

function status(){
  $("dot").className="dot"+(active&&updated&&!err?" ok":"");
  $("stt").textContent=!active?"pasif":err||(updated?new Date(updated).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"bekleniyor");
  $("act").textContent=active?"● AKTİF":"○ PASİF";
  $("act").className="pill"+(active?"":" off");
  $("note").hidden=active;
  $("nm").textContent=matches.length;$("nr").textContent=rules.length;
}

function detailHtml(m){
  const d=det[m.id];
  if(!d)return '<div class="dt mute">Yükleniyor...</div>';
  if(d.error)return `<div class="dt mute">${esc(d.error)}</div>`;
  if(d.passive)return '<div class="dt mute">Pasif: API\'ye sorgu atılmıyor.</div>';
  const f=v=>v==null||v===""?"–":esc(v);
  const row=(t,x)=>x?`<tr><td>${t}</td><td>${f(x.home)}</td><td>${f(x.draw)}</td><td>${f(x.away)}</td><td>${f(x.over25)}</td><td>${f(x.under25)}</td></tr>`:`<tr><td>${t}</td><td colspan="5" class="mute">veri yok</td></tr>`;
  const T=(d.totals||{})[dper]||{},o=d.odds||{},rows=(d.stats||{})[dper]||[];
  return `<div class="dt">
    <table><tr><th></th><th>1</th><th>X</th><th>2</th><th>2.5 Üst</th><th>2.5 Alt</th></tr>${row("Maç önü",o.pre)}${row("Canlı",o.live)}</table>
    <div class="pt">${TABS.map(p=>`<button data-per="${p[0]}" class="${p[0]===dper?"on":""}">${p[1]}</button>`).join("")}</div>
    <p class="tot">Toplam şut <b class="mono">${f(T.shots)}</b> · isabetli <b class="mono">${f(T.sot)}</b> · xG <b class="mono">${T.xg==null?"–":T.xg.toFixed(2)}</b> · kırmızı <b class="mono">${f(T.red)}</b></p>
    ${rows.length?`<table class="sx">${rows.map(s=>`<tr><td>${f(s.home)}</td><td>${esc(SN[s.type]||s.type)}</td><td>${f(s.away)}</td></tr>`).join("")}</table>`:`<p class="mute">${dper==="l10"?"Son 10 dk yalnızca özet gösterir. Sunucu bu maçı en az 10 dk izlediyse dolar.":"Bu dönem için istatistik yok."}</p>`}
    ${d.warn?`<p class="mute">${esc(d.warn)}</p>`:""}</div>`;
}

function renderMatches(){
  const q=$("q").value.trim().toLowerCase();
  const L=matches.filter(m=>!q||(m.home+" "+m.away).toLowerCase().includes(q)).sort((a,b)=>isLive(b)-isLive(a));
  $("list").innerHTML=L.length?L.map(m=>{
    const n=rules.filter(r=>r.matchId&&same(r.matchId,m.id)&&!r.draft).length,lv=isLive(m);
    return `<div class="mw"><div class="m" data-om="${esc(m.id)}">
      <div class="min ${lv?"live":""}">${lv?esc(m.minute)+"'":esc(m.status||"–")}</div>
      <div><div class="tm"><span>${esc(m.home)}</span><b class="mono">${esc(m.homeGoals==null?"-":m.homeGoals)}</b></div>
      <div class="tm"><span>${esc(m.away)}</span><b class="mono">${esc(m.awayGoals==null?"-":m.awayGoals)}</b></div></div>
      <button class="add" data-newm="${esc(m.id)}" aria-label="Bu maça kural ekle">${n?`<i>${n}</i>`:""}＋</button>
    </div>${same(openM,m.id)?detailHtml(m):""}</div>`}).join(""):`<p class="empty">${matches.length?"Eşleşen maç yok.":"Maç verisi yok. Skor API'si bağlı mı?"}</p>`;
}

const target=r=>r.matchId?esc(r.matchLabel||("Maç "+r.matchId)):"Tüm maçlar";
const perT=c=>STAT.test(c.metric)&&c.period&&c.period!=="all"?(c.period==="last"?` (son ${c.last||10} dk)`:` (${PER.find(p=>p[0]===c.period)[1]})`):"";
const winT=r=>(r.minFrom!=null||r.minTo!=null)?` · ${r.minFrom??""}–${r.minTo??""}'`:"";
const
